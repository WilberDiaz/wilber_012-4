<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMaster 🛒</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="styles.css">

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🛒 ShopMaster</a>

        <button class="btn btn-light position-relative" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </button>
    </div>
</nav>

<!-- CONTENEDOR DE PRODUCTOS -->
<div class="container my-4">
    <div class="row" id="product-list"></div>
</div>


<!-- MODAL DE PRODUCTO -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center">
                <img id="modalImage" class="img-fluid mb-3" style="max-height: 300px;">
                <p id="modalDescription"></p>
                <h4 class="text-success" id="modalPrice"></h4>

                <label for="quantity" class="fw-bold">Cantidad:</label>
                <input type="number" id="modalQuantity" class="form-control w-25 mx-auto" min="1" value="1">

                <button class="btn btn-success mt-3" onclick="addToCartFromModal()">
                    🛒 Agregar al carrito
                </button>
            </div>
        </div>
    </div>
</div>


<!-- CARRITO LATERAL -->
<div id="cart-sidebar" class="cart-sidebar">
    <h4 class="text-center mt-3">🛒 Carrito de compras</h4>
    <ul id="cart-items" class="list-group my-3"></ul>

    <h5 class="text-center">Total: $<span id="cart-total">0</span></h5>

    <button class="btn btn-success w-100 my-3" onclick="openPayment()">💳 Ir a pagar</button>
    <button class="btn btn-secondary w-100" onclick="toggleCart()">Cerrar</button>
</div>


<!-- PASARELA DE PAGO -->
<div class="modal fade" id="paymentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">💳 Pago seguro</h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <label class="fw-bold">Nombre completo</label>
                <input type="text" id="payName" class="form-control mb-2">

                <label class="fw-bold">Número de tarjeta</label>
                <input type="text" id="payCard" class="form-control mb-2">

                <label class="fw-bold">Fecha de vencimiento</label>
                <input type="month" id="payDate" class="form-control mb-2">

                <label class="fw-bold">CVV</label>
                <input type="number" id="payCVV" class="form-control mb-3">

                <button class="btn btn-success w-100" onclick="processPayment()">Pagar ahora ✅</button>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap & Script principal -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
